# Local development services. Run the API and web app on the host:
#   dotnet run --project backend/src/HRS.Api   and   pnpm -C frontend dev
name: hrs-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hrs
      POSTGRES_USER: hrs
      POSTGRES_PASSWORD: hrs_dev_password
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrs -d hrs"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]   # SMTP, web UI

  # S3-compatible storage for local dev. MinIO pulled its free images from
  # Docker Hub and Quay in 2026 (see docs/adr/0006-rustfs-dev-storage.md);
  # RustFS is a drop-in with the same ports and a compatible S3 API.
  storage:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: hrs
      RUSTFS_SECRET_KEY: hrs_dev_password
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports: ["9000:9000", "9001:9001"]
    volumes: [storagedata:/data]

  clamav:
    image: clamav/clamav:stable
    ports: ["3310:3310"]

volumes:
  pgdata:
  storagedata:
