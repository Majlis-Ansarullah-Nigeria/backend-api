# Local development services. Run the API and web app on the host:
#   dotnet run --project backend/src/HRS.Api   and   pnpm -C frontend dev
name: hrs-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hrs
      POSTGRES_USER: hrs
      POSTGRES_PASSWORD: hrs_dev_password
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrs -d hrs"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]   # SMTP, web UI

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hrs
      MINIO_ROOT_PASSWORD: hrs_dev_password
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  clamav:
    image: clamav/clamav:stable
    ports: ["3310:3310"]

volumes:
  pgdata:
  miniodata:
